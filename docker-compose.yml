version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-council-backend
    ports:
      # Usiamo la porta 8099 esterna per evitare i conflitti sulla VPS
      - "8099:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-council-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # ⚠️ IMPORTANTE: Sostituisci questo URL con il dominio reale che assegnerai al backend su Coolify!
      - VITE_API_URL=https://api-council.tuodominio.com
      - REACT_APP_API_URL=https://api-council.tuodominio.com
    tty: true
    command: npm run dev
