version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-council-backend
    ports:
      - "8081:8001"
    env_file:
      - .env
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-council-frontend
    ports:
      - "5174:5173"
    environment:
      # Punta al dominio sslip.io pubblico del tuo backend (senza porta alla fine!)
      - VITE_API_BASE=http://zbg3qvd5nf3ugr03u5rw8c8p.213.199.59.101.sslip.io
      - VITE_API_URL=http://zbg3qvd5nf3ugr03u5rw8c8p.213.199.59.101.sslip.io
    tty: true
