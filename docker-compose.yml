version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-council-backend
    ports:
      # Mappiamo la porta 8081 esterna sulla 8001 interna di FastAPI
      - "8081:8001"
    volumes:
      - .:/app
    env_file:
      - .env
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-council-frontend
    ports:
      # Mappiamo la porta 5174 esterna sulla 5173 interna di Vite
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # ⚠️ Sostituisci con l'URL pubblico reale che assegnerai al backend su Coolify
      - VITE_API_BASE=https://api-council.tuodominio.com
      - VITE_API_URL=https://api-council.tuodominio.com
    tty: true
